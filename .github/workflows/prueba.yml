name: Comprobacion de Tokens
on: [push]

jobs:
  verificar-secretos:
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN local y remoto
        shell: powershell.
        run: |
          if ("${{ secrets.DEV_TOKEN }}" -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Exito: Los tokens coinciden."
          } else {
            Write-Host "Error: Los tokens NO coinciden."
            exit 1
          }